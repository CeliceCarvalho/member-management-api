services:
  api:
    build: .
    container_name: member-management-api
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://member_management:member_management@db:5432/member_management
      DIRECT_URL: postgresql://member_management:member_management@db:5432/member_management
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: member-management-db
    environment:
      POSTGRES_USER: member_management
      POSTGRES_PASSWORD: member_management
      POSTGRES_DB: member_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U member_management -d member_management"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
